<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#BFE3FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="سباق العربية">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>html,body{margin:0;padding:0}</style>
<title>سباق العربية</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=Noto+Naskh+Arabic:wght@500;700&display=swap">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
/* Layout: one full-screen WebGL canvas (garage turntable, then the city race) with HTML overlays — garage menu, race HUD (lap, place, stars, speed, minimap), question panel with lane chips, steer pads, and bright lesson cards (story, sentence workshop, notebook). Single bright theme by choice: the family asked for light, colourful screens only. */
:root{
  --sky:#BFE3FF; --paper:#FFFBEF; --ink:#2B2A33; --muted:#6B6878; --gold:#FFD23F; --good:#2BB673; --coral:#FF6B57; --mint:#2EC4B6; --grape:#8E7CFF; --sea:#3FA2FF; --maroon:#8A1538;
  --lane0:#FFD23F; --lane1:#5CE1E6; --lane2:#FF9EC7;
  --display:'Baloo Bhaijaan 2',system-ui,sans-serif; --read:'Noto Naskh Arabic','Amiri','Traditional Arabic',serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--display);direction:rtl;overflow:hidden;-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none;-webkit-user-select:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
input{font-family:inherit;color:inherit}
#gl{position:fixed;inset:0}
#gl canvas{display:block;width:100%;height:100%;touch-action:none}
.pill{background:var(--paper);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);border-radius:12px;padding:2px 10px;font-weight:800;font-size:18px;display:flex;gap:5px;align-items:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.bump{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.icon{width:44px;height:44px;font-size:20px;background:var(--paper);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);border-radius:12px;display:grid;place-items:center}
.icon:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
/* garage */
#garage{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
#garage > *{pointer-events:auto}
.gtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gtop .grow{flex:1}
.logo{font-size:30px;font-weight:800;line-height:1;background:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink);padding:6px 14px}
.logo span{color:var(--coral)}
.gbottom{display:flex;flex-direction:column;align-items:center;gap:8px;max-width:520px;width:100%;margin:0 auto}
.carname{display:flex;align-items:center;gap:10px;width:100%;justify-content:center}
.carname b{font-size:26px;font-weight:800;background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:2px 16px;min-width:180px;text-align:center;box-shadow:0 4px 0 var(--ink)}
.arrow{width:58px;height:58px;font-size:28px;border-radius:50%;background:var(--gold);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink)}
.arrow:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.swatches{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;direction:ltr}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.sw.sel{outline:4px solid #fff;outline-offset:2px;transform:scale(1.12)}
.sw.off{opacity:.25;pointer-events:none}
.stats{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.mbtn{min-height:62px;border:3px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink);background:var(--paper);font-weight:800;font-size:17px;line-height:1.15;padding:6px}
.mbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.mbtn small{display:block;font-size:12px;color:var(--muted)}
.go{width:100%;min-height:68px;font-size:26px;font-weight:800;border:3px solid var(--ink);border-radius:16px;box-shadow:0 6px 0 var(--ink);background:linear-gradient(#FFE36E,#FFC21A);animation:pulse 1.4s ease-in-out infinite}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
input.nm{width:100%;max-width:280px;font-size:20px;font-weight:700;text-align:center;padding:6px 12px;border:3px solid var(--ink);border-radius:10px;background:#fff}
/* race HUD */
.hud{position:fixed;top:0;left:0;right:0;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 0;display:flex;align-items:flex-start;gap:6px;pointer-events:none;z-index:5;flex-wrap:wrap}
.hud > *{pointer-events:auto}
.hud .grow{flex:1}
#mini{position:fixed;left:10px;top:calc(62px + env(safe-area-inset-top,0px));width:104px;height:104px;border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);z-index:5;background:#E9F6E1}
.speedo{position:fixed;right:12px;bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:2px 10px;text-align:center;font-weight:800;direction:ltr;pointer-events:none}
.speedo b{font-size:30px;line-height:1;display:block;font-variant-numeric:tabular-nums}
.speedo small{font-size:12px;color:var(--muted)}
.boostbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;font-weight:800;font-size:20px;background:var(--gold);border:3px solid var(--ink);border-radius:999px;padding:4px 18px;box-shadow:0 4px 0 var(--ink);animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.pad{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:110px;height:110px;border-radius:50%;background:rgba(255,251,239,.72);border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);z-index:6;font-size:46px;display:grid;place-items:center;touch-action:none}
.pad.l{left:14px}.pad.r{right:14px}
.pad.on{background:var(--gold);transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.horn{position:fixed;bottom:calc(136px + env(safe-area-inset-bottom,0px));left:22px;z-index:6;width:62px;height:62px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-size:28px}
.horn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
#qpanel{position:fixed;top:calc(62px + env(safe-area-inset-top,0px));left:10px;right:10px;margin-inline:auto;max-width:560px;z-index:7;background:var(--paper);border:4px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);padding:8px 10px;display:flex;flex-direction:column;gap:6px;align-items:center;animation:drop .45s cubic-bezier(.3,1.5,.5,1)}
#qpanel .qhead{display:flex;align-items:center;gap:8px;width:100%;justify-content:center}
#qpanel .tag{font-size:14px;font-weight:800;color:#fff;background:var(--coral);border-radius:999px;padding:1px 10px}
#qpanel .qt{font-family:var(--read);font-size:22px;font-weight:700;line-height:1.55;text-align:center;text-wrap:balance}
#qpanel .qt.stem{font-size:44px;line-height:1.3}
.blank{display:inline-block;width:.75em;height:1em;vertical-align:-.1em;border:4px dashed var(--coral);border-radius:10px;background:#FFF0EA;margin-inline:.05em}
.fill{color:#1E7A41;background:#DFF6E6;border-radius:10px;padding-inline:.06em}
.chips{display:flex;gap:6px;width:100%;direction:ltr}
.chip{flex:1;min-height:52px;border:3px solid var(--ink);border-radius:12px;box-shadow:0 4px 0 var(--ink);font-family:var(--read);font-weight:700;font-size:20px;line-height:1.3;padding:2px 6px;display:grid;place-items:center;direction:rtl;overflow-wrap:anywhere}
.chip.c0{background:var(--lane0)}.chip.c1{background:var(--lane1)}.chip.c2{background:var(--lane2)}
.chip.big{font-size:38px;line-height:1}
.chip.target{outline:4px solid var(--ink);outline-offset:2px}
.chip.right{background:#7BE0A5!important;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.chip.wrong{background:#FFB3B3!important;opacity:.6}
.say{width:44px;height:44px;font-size:20px;flex:none}
.toast{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:9;font-size:44px;font-weight:800;color:#fff;-webkit-text-stroke:2px var(--ink);text-shadow:0 5px 0 var(--ink);pointer-events:none;white-space:nowrap;animation:toast 1.2s ease-out forwards}
.count{position:fixed;inset:0;display:grid;place-items:center;z-index:9;pointer-events:none;font-size:140px;font-weight:800;color:#fff;-webkit-text-stroke:4px var(--ink);text-shadow:0 8px 0 var(--ink)}
.count span{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
/* cards */
.overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(191,227,255,.55)}
.card{width:100%;max-width:480px;max-height:100%;overflow:auto;background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:0 8px 0 var(--ink);padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.card > *{flex-shrink:0}
.card h1{margin:0;font-size:30px;font-weight:800;line-height:1.15;text-wrap:balance}
.card h2{margin:0;font-size:22px;font-weight:800;line-height:1.25;text-wrap:balance}
.card p{margin:0;font-size:17px;color:var(--muted);font-weight:700}
.card p.again{color:var(--coral)}
.who{display:flex;align-items:center;gap:8px;background:#EAF6FF;border:2px solid var(--ink);border-radius:999px;padding:3px 14px;font-weight:800;font-size:17px}
.qtext{font-family:var(--read);font-size:27px;font-weight:700;line-height:1.7;margin:0;text-wrap:balance}
.row{display:flex;gap:10px;width:100%;justify-content:center;flex-wrap:wrap}
.choice{flex:1 1 40%;min-width:120px;min-height:64px;border:3px solid var(--ink);border-radius:12px;box-shadow:0 6px 0 var(--ink);background:#FFF4C2;font-family:var(--read);font-weight:700;font-size:21px;line-height:1.5;display:grid;place-items:center;padding:6px 10px;overflow-wrap:anywhere}
.choice:nth-child(2){background:#DDF6FF}.choice:nth-child(3){background:#FFE3F0}
.choice.long{flex-basis:100%}
.choice:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.choice.right{background:#DFF6E6!important;box-shadow:0 6px 0 var(--good);color:#1E7A41;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.choice.wrong{background:#FFF0F0!important;opacity:.45;animation:shake .4s;pointer-events:none}
.choice.hint{animation:glow 1s ease-in-out infinite}
.btn{min-height:56px;border:3px solid var(--ink);border-radius:12px;box-shadow:0 5px 0 var(--ink);font-size:20px;font-weight:800;display:grid;place-items:center;padding:8px 22px;background:var(--gold)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.btn.wide{width:100%}.btn.soft{background:var(--paper)}
.bar{width:100%;height:18px;border:3px solid var(--ink);border-radius:8px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--mint);transition:width .3s}
.story{width:100%;display:flex;flex-direction:column;gap:6px;text-align:right}
.sline{display:flex;align-items:center;gap:8px;border:2px solid #E3D9C2;border-radius:12px;padding:6px 8px;background:#fff}
.sline .t{font-family:var(--read);font-size:21px;line-height:1.8;flex:1}
.sline.cur{background:#FFF4C2;border-color:var(--ink)}
.sline button{flex:none;width:40px;height:40px;border:2px solid var(--ink);border-radius:10px;background:#EAF6FF;font-size:18px}
.stitle{font-family:var(--read);font-size:30px;font-weight:700;color:#1E6FB8}
.slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:70px;width:100%;padding:8px;border:3px dashed #C9BBA3;border-radius:14px;background:#F6F0E2;direction:rtl}
.wslot{font-family:var(--read);font-weight:700;font-size:24px;border:3px solid var(--ink);border-radius:10px;padding:2px 12px;background:#fff;animation:pop .3s cubic-bezier(.3,1.6,.5,1);display:flex;flex-direction:column;align-items:center;line-height:1.5}
.wslot small{font-family:var(--display);font-size:13px;font-weight:800;border-radius:999px;padding:0 8px;color:#fff}
.wslot.v{background:#DDF0FF}.wslot.v small{background:#3FA2FF}
.wslot.s{background:#E2F8E9}.wslot.s small{background:#2BB673}
.wpool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%}
.wblock{font-family:var(--read);font-weight:700;font-size:24px;border:3px solid var(--ink);border-radius:12px;box-shadow:0 5px 0 var(--ink);background:#FFF4C2;padding:4px 14px;min-height:56px}
.wblock:nth-child(3n+2){background:#DDF6FF}.wblock:nth-child(3n){background:#FFE3F0}
.wblock:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.wblock.used{opacity:.2;pointer-events:none;box-shadow:none}
.wblock.wrong{animation:shake .4s}.wblock.hint{animation:glow 1s ease-in-out infinite}
.book{max-width:540px;align-items:stretch;text-align:right;gap:12px}
.book h1{text-align:center}
.sec{border:3px solid var(--ink);border-radius:14px;overflow:hidden}
.sec > h3{margin:0;padding:6px 12px;font-size:19px;font-weight:800;color:#fff}
.sec .body{padding:10px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;background:#fff}
.sec.c1 > h3{background:#3FA2FF}.sec.c2 > h3{background:#8E7CFF}.sec.c3 > h3{background:#FF6B57}.sec.c4 > h3{background:#2BB673}.sec.c5 > h3{background:#E39B00}
.wcard{border:2px solid var(--ink);border-radius:10px;padding:6px 8px;display:flex;align-items:center;justify-content:space-between;gap:6px;background:#FFFBEF;min-width:0}
.wcard div{font-family:var(--read);font-size:19px;line-height:1.5;min-width:0}
.wcard button{flex:none;width:36px;height:36px;border:2px solid var(--ink);border-radius:8px;background:#EAF6FF;font-size:16px}
.tip{grid-column:1/-1;font-size:16px;font-weight:700;line-height:1.7}
.tip .read{font-family:var(--read);font-size:19px}
.prog{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-weight:800;font-size:15px}
.prog .bar{height:16px;border-width:2px}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;direction:ltr;height:150px}
.pod{width:84px;border:3px solid var(--ink);border-radius:10px 10px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:4px;font-weight:800;font-size:15px;line-height:1.1}
.pod b{font-size:30px}
.credits{font-size:11px;color:var(--muted);line-height:1.4}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:12;width:100%;height:100%}
#loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:linear-gradient(#DDF3FF,#BFE3FF)}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
@keyframes drop{0%{transform:translateY(-40px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes glow{0%,100%{box-shadow:0 6px 0 var(--ink),0 0 0 0 #FFD23F}50%{box-shadow:0 6px 0 var(--ink),0 0 0 8px #FFD23F}}
@keyframes toast{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}20%{transform:translate(-50%,-50%) scale(1.1);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-90%) scale(1);opacity:0}}
@media (orientation:landscape) and (max-height:520px){.gbottom{position:absolute;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(48%,430px);gap:6px}.gbottom input.nm{display:none}.go{min-height:54px;font-size:22px}.mbtn{min-height:52px;font-size:15px}.carname b{font-size:20px;min-width:140px}.arrow{width:46px;height:46px;font-size:22px}.sw{width:32px;height:32px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.qtext{font-size:23px}#qpanel .qt{font-size:19px}#qpanel .qt.stem{font-size:38px}.chip{font-size:17px}.pad{width:96px;height:96px;font-size:40px}.logo{font-size:24px}.carname b{font-size:21px;min-width:140px}.pill{font-size:16px;padding:2px 7px}}
</style>
</head>
<body>


<div id="gl"></div>
<div id="loading"><div class="card"><h1>سباق العربية 🏎️</h1><p id="loadMsg">جاري تجهيز السيارات…</p><div class="bar"><i id="loadBar"></i></div></div></div>

<div id="garage" hidden>
  <div class="gtop">
    <div class="logo">سباق <span>العربية</span> 🏁</div>
    <span class="grow"></span>
    <div class="pill">⭐ <b class="starsN">0</b></div>
    <div class="pill">🏆 <b id="winsN">0</b></div>
    <button class="icon" id="gSound" aria-label="الصوت">🔊</button>
  </div>
  <div class="gbottom">
    <div class="carname"><button class="arrow" id="carPrev" aria-label="السيارة السابقة">▶</button><b id="carName"></b><button class="arrow" id="carNext" aria-label="السيارة التالية">◀</button></div>
    <div class="swatches" id="swatches"></div>
    <input class="nm" id="nameInput" maxlength="14" placeholder="اسم السائق (اختياري)" autocomplete="off">
    <button class="go" id="btnRace">🏁 ابدأ السباق</button>
    <div class="menu">
      <button class="mbtn" id="btnStory">📖 القصة<small>في حديقة الحي</small></button>
      <button class="mbtn" id="btnWork">🧩 ورشة الجمل<small>الجملة الفعلية</small></button>
      <button class="mbtn" id="btnBook">📒 الدفتر<small>القواعد</small></button>
    </div>
  </div>
</div>

<div class="hud" id="hud" hidden>
  <div class="pill" id="lapPill">🏁 <b id="lapN">1/2</b></div>
  <div class="pill" id="posPill">🥇 <b id="posN">1/4</b></div>
  <div class="pill" id="starPill">⭐ <b class="starsN">0</b></div>
  <span class="grow"></span>
  <button class="icon" id="rSound" aria-label="الصوت">🔊</button>
  <button class="icon" id="rPause" aria-label="إيقاف">⏸️</button>
</div>
<canvas id="mini" width="120" height="120" hidden></canvas>
<div class="speedo" id="speedo" hidden><b id="spd">0</b><small>كم/س</small></div>
<button class="pad l" id="padL" hidden aria-label="يسار">⬅️</button>
<button class="pad r" id="padR" hidden aria-label="يمين">➡️</button>
<button class="horn" id="horn" hidden aria-label="البوري">📯</button>
<div id="qpanel" hidden></div>
<div id="boost" class="boostbar" hidden>🔥 نيترو!</div>
<div class="overlay" id="modal" hidden><div class="card" id="mcard"></div></div>
<canvas id="confetti"></canvas>

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

":"st6","t":"وَضَعَ الوَلَدُ الوَرَقَةَ في سَلَّةِ المُهْمَلاتِ، وَابْتَسَمَ.","say":"st6"},{"id":"st7","t":"رَجَعَ سالِمٌ وَلَيْلى إِلى البَيْتِ فَرِحَيْن.","say":"st7"}],"title":"في حَديقَةِ الحَيّ"};
const QS=LESSON.Q, ORDER=LESSON.O, STORY=LESSON.S;
const CAT_NAME={fi:'الجملة الفعلية',alif:'الألف المقصورة والياء',tanw:'التنوين',rule:'القواعد',read:'قصة: في حديقة الحي'};

/* ================= save ================= */
let save={car:0,colors:{},name:'',mastery:{},wins:0,races:0,sound:true,music:true};
try{const s=localStorage.getItem('sibaq-v1');if(s)save=Object.assign(save,JSON.parse(s));}catch(e){}
function persist(){try{localStorage.setItem('sibaq-v1',JSON.stringify(save));}catch(e){}}
const mastered=()=>QS.filter(q=>(save.mastery[q.id]||0)>0).length;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= audio ================= */
let AC=null,vsrc=null,vtoken=0;const bufs={};
function audioInit(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function decode(buf){return new Promise((res,rej)=>{try{const p=AC.decodeAudioData(buf,res,rej);if(p&&p.then)p.then(res,rej);}catch(e){rej(e);}});}
function getBuf(url){if(!bufs[url])bufs[url]=fetch(url).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer();}).then(decode).catch(e=>{delete bufs[url];throw e;});return bufs[url];}
const vurl=id=>'v-'+id+'.mp3';
function stopVoice(){vtoken++;if(vsrc){try{vsrc.stop();}catch(e){}vsrc=null;}duck(false);}
async function say(id){if(!id||!AC||!save.sound)return;const my=++vtoken;if(vsrc){try{vsrc.stop();}catch(e){}vsrc=null;}let b;try{b=await getBuf(vurl(id));}catch(e){return;}if(my!==vtoken)return;
  const s=AC.createBufferSource();s.buffer=b;const g=AC.createGain();g.gain.value=1.2;s.connect(g);g.connect(AC.destination);vsrc=s;duck(true);s.start();
  return new Promise(r=>{s.onended=()=>{if(vsrc===s){vsrc=null;duck(false);}r();};});}
function prefetch(ids){if(AC)ids.forEach(i=>getBuf(vurl(i)).catch(()=>{}));}
async function sfx(name,vol,rate){if(!AC||!save.sound)return;try{const b=await getBuf('snd-'+name+'.mp3');const s=AC.createBufferSource();s.buffer=b;if(rate)s.playbackRate.value=rate;const g=AC.createGain();g.gain.value=vol||0.6;s.connect(g);g.connect(AC.destination);s.start();return s;}catch(e){}}
function beep(f,d,vol,type){if(!AC||!save.sound)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.18,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.05);}
function tap(){beep(880,0.07,0.15);}
let engine=null,musicNode=null;
async function engineStart(){if(!AC||!save.sound||engine)return;try{const b=await getBuf('snd-engine.mp3');const s=AC.createBufferSource();s.buffer=b;s.loop=true;s.loopStart=0.08;s.loopEnd=b.duration-0.08;const g=AC.createGain();g.gain.value=0.0;s.connect(g);g.connect(AC.destination);s.start(0,0.1);engine={s,g};}catch(e){}}
function engineStop(){if(engine){try{engine.s.stop();}catch(e){}engine=null;}}
async function musicStart(){if(!AC||!save.sound||!save.music||musicNode)return;try{const b=await getBuf('snd-music.mp3');const s=AC.createBufferSource();s.buffer=b;s.loop=true;const g=AC.createGain();g.gain.value=0.1;s.connect(g);g.connect(AC.destination);s.start();musicNode={s,g};}catch(e){}}

  if(phase==='menu'){if(gCar){gSpin+=dt*0.5;gCar.rotation.y=gSpin;}const portrait=innerHeight>innerWidth,short=!portrait&&innerHeight<=520;camera.fov=portrait?62:50;camera.updateProjectionMatrix();const sh=short?3.4:0,rx=Math.cos(0.6),rz=-Math.sin(0.6);camera.position.set(Math.sin(0.6)*(portrait?11:9)+rx*sh,portrait?5.2:3.4,Math.cos(0.6)*(portrait?11:9)+rz*sh);camera.lookAt(rx*sh,portrait?-1.6:0.2,rz*sh);renderer.render(gScene,camera);return;}
  if(!player||phase==='loading'){renderer.render(gScene,camera);return;}
  // ----- player -----
  const P=player;
  if(phase==='race'&&racing&&!P.done){raceT+=dt;
    let steerIn=(steerKeys.r?1:0)-(steerKeys.l?1:0);
    if(autoTarget!==null&&!steerIn){const d=autoTarget-P.x;steerIn=Math.abs(d)<0.3?0:Math.sign(d);if(Math.abs(d)<0.3)P.x=lerp(P.x,autoTarget,0.2);}
    steer=lerp(steer,steerIn,Math.min(1,dt*10));
    // target speed
    let vt=26.5;const nextG=gates.find(g=>g.state!=='done'&&g.lap===P.lap&&g.s>P.s-2);
    if(nextG){const dist=nextG.s-P.s;if(nextG.state==='idle'&&dist<ZONE){activateGate(nextG);}
      if(nextG.type==='lane'&&dist<ZONE)vt=15.5;
      if(nextG.type==='stop'){if(dist<ZONE){vt=Math.max(0,Math.min(vt,(dist-6)*0.6));const br=nextG.bars;if(br&&nextG.state==='active'&&dist<60){br.visible=true;br.position.y=lerp(br.position.y,0,Math.min(1,dt*3));}}
        if(dist<8&&nextG.state==='active'){P.v=0;stopGateAsk(nextG);}}
      if(nextG.type==='lane'&&nextG.state==='active'&&P.s>=nextG.s)passLaneGate(nextG);}
    if(P.boost>0){vt=39;P.boost-=dt;if(P.boost<=0)$('#boost').hidden=true;}
    if(P.spin>0){vt=7;P.spin-=dt;}
    P.v+= (vt-P.v)*Math.min(1,dt*(vt>P.v?1.1:2.5));
    P.s+=P.v*dt;P.x=clamp(P.x+steer*9*dt,-ROAD_W/2+1.2,ROAD_W/2-1.2);
    P.yawOff=lerp(P.yawOff||0,-steer*0.12*Math.min(1,P.v/15),Math.min(1,dt*8));
    if(P.s>=L){P.s-=L;P.lap++;if(P.lap>=LAPS){P.done=true;finishOrder.push('you');finishRace();}else{toast('🏁 اللفة '+(P.lap+1));beep(988,0.1);setTimeout(()=>beep(1319,0.2),110);}}}
  const spinAng=P.spin>0?(1.2-P.spin)*Math.PI*2.2:0;placeCar(P,dt,spinAng);
  // ----- AI -----
  ais.forEach(a=>{if(phase==='race'&&racing){
      let vt=a.base;const gap=progOf(P)-progOf(a);if(!P.done){if(gap>70)vt+=3;else if(gap<-90)vt-=3.5;}
      const ng=gates.find(g=>g.lap===a.lap&&g.s>a.s&&g.s-a.s<ZONE);if(ng&&!a.done)vt=Math.min(vt,ng.type==='stop'?17:15.5);
      if(a.done)vt=14;
      a.v+=(vt-a.v)*Math.min(1,dt*1.0);a.s+=a.v*dt;
      a.laneT-=dt;if(a.laneT<=0){a.laneT=3+Math.random()*5;a.tx=rnd([-1,0,1])*LANE_W;}
      // avoid player
      const ds=progOf(a)-progOf(P);if(Math.abs(ds)<10&&Math.abs(a.tx-P.x)<2.5)a.tx=clamp(P.x+(P.x>0?-LANE_W:LANE_W),-LANE_W,LANE_W);
      a.x=lerp(a.x,a.tx,Math.min(1,dt*1.5));
      if(a.s>=L){a.s-=L;a.lap++;if(a.lap>=LAPS&&!a.done){a.done=true;finishOrder.push(a.name);}}}
    placeCar(a,dt,0);
    // bump with player
    if(phase==='race'){const ds=progOf(a)-progOf(P);if(Math.abs(ds)<4.4&&Math.abs(a.x-P.x)<2.1){if(ds>0){P.v=Math.min(P.v,a.v-3);P.s-=0.15;}else{a.v=Math.min(a.v,P.v-3);}
        P.x=clamp(P.x+(P.x>a.x?1:-1)*0.15,-ROAD_W/2+1.2,ROAD_W/2-1.2);if(t>P.bumpT){P.bumpT=t+0.8;sfx('bump',0.5);vib(25);}}}});
  // cones flying
  gates.forEach(g=>{if(g.cones)g.cones.children.forEach(c=>{const v=c.userData.v;if(!v)return;v.y-=18*dt;c.position.addScaledVector(v,dt);c.rotation.x+=dt*8;if(c.position.y<0&&v.y<0){c.position.y=0;v.set(0,0,0);c.userData.v=null;}});});
  flags.forEach(f=>{const pos=f.geometry.attributes.position,b=f.userData.base;for(let i=0;i<pos.count;i++){const x=b[i*3];pos.array[i*3+2]=Math.sin(x*2.4+t*5)*0.16*((x+1.5)/3);}pos.needsUpdate=true;});
  // engine
  if(engine&&AC){const r=0.65+P.v/39*1.0;engine.s.playbackRate.setTargetAtTime(r,AC.currentTime,0.08);if(!vsrc)engine.g.gain.setTargetAtTime(phase==='race'?0.16+P.v/39*0.12:0,AC.currentTime,0.1);}
  $('#spd').textContent=Math.round(P.v*3.6);
  // camera (chase)
  const back=P.boost>0?12.5:11;const cp=posAt(P.s-back,P.x*0.85);const lp=posAt(P.s+18,P.x*0.7);
  camPos.lerp(new THREE.Vector3(cp.x,4.6+(P.boost>0?0.3:0),cp.z),Math.min(1,dt*6));camLook.lerp(new THREE.Vector3(lp.x,1.6,lp.z),Math.min(1,dt*8));
  if(camPos.lengthSq()<1||camPos.distanceTo(new THREE.Vector3(cp.x,4.6,cp.z))>60){camPos.set(cp.x,4.6,cp.z);camLook.set(lp.x,1.6,lp.z);}
  camera.position.copy(camPos);camera.lookAt(camLook);const fov=P.boost>0?70:60;if(Math.abs(camera.fov-fov)>0.2){camera.fov=lerp(camera.fov,fov,Math.min(1,dt*4));camera.updateProjectionMatrix();}
  miniT-=dt;if(miniT<=0){miniT=0.15;drawMini();updHud();}
  renderer.render(rScene,camera);}

/* ================= minimap ================= */
let miniPath=null;
function drawMini(){const c=$('#mini');const g=c.getContext('2d');const W=c.width;
  if(!miniPath){let minx=1e9,maxx=-1e9,minz=1e9,maxz=-1e9;for(let i=0;i<NS;i++){minx=Math.min(minx,PX[i]);maxx=Math.max(maxx,PX[i]);minz=Math.min(minz,PZ[i]);maxz=Math.max(maxz,PZ[i]);}
    const k=(W-20)/Math.max(maxx-minx,maxz-minz);miniPath={k,ox:10-minx*k+((W-20)-(maxx-minx)*k)/2,oz:10-minz*k+((W-20)-(maxz-minz)*k)/2};}
  const m=miniPath;const X=x=>m.ox+x*m.k,Z=z=>m.oz+z*m.k;g.clearRect(0,0,W,W);g.lineWidth=7;g.strokeStyle='#2B2A33';g.lineJoin='round';g.beginPath();for(let i=0;i<NS;i+=4){const x=X(PX[i]),z=Z(PZ[i]);i?g.lineTo(x,z):g.moveTo(x,z);}g.closePath();g.stroke();g.lineWidth=3;g.strokeStyle='#FFFFFF';g.stroke();
  gates.forEach(gt=>{if(gt.state==='done'||gt.lap!==player.lap)return;const p=trackAt(gt.s);g.fillStyle=gt.type==='stop'?'#E39B00':'#FF6B57';g.fillRect(X(p.px)-3,Z(p.pz)-3,6,6);});
  ais.forEach(a=>{const p=trackAt(a.s);g.fillStyle='#3FA2FF';g.beginPath();g.arc(X(p.px),Z(p.pz),4,0,7);g.fill();});
  const p=trackAt(player.s);g.fillStyle='#FFD23F';g.strokeStyle='#2B2A33';g.lineWidth=2;g.beginPath();g.arc(X(p.px),Z(p.pz),6,0,7);g.fill();g.stroke();}

/* ================= finish ================= */
async function finishRace(){racing=false;phase='finish';hidePanel();$('#boost').hidden=true;
  const pos=finishOrder.indexOf('you')+1;save.races=(save.races||0)+1;if(pos===1)save.wins=(save.wins||0)+1;persist();updStars();
  sfx('cheer',0.7);confetti();await say(pos===1?'ev_first':'ev_finish');

  const rest=ais.filter(a=>!finishOrder.includes(a.name)).sort((x,y)=>progOf(y)-progOf(x)).map(a=>a.name);const order=finishOrder.concat(rest);
  const c=openModal();c.appendChild(el('h1','',pos===1?'🏆 المركز الأول!':(pos===2?'🥈 المركز الثاني':(pos===3?'🥉 المركز الثالث':'🏁 وصلت!'))));
  c.appendChild(el('p','',pos===1?'أنت بطل السباق! جاوبت وسبقت الكل':'ممتاز! جاوب أسرع عشان النيترو يوصلك للأول 🔥'));

  c.appendChild(el('div','pill','⭐ نجومك: '+mastered()+'/'+QS.length));
  const again=el('button','btn wide','🏁 سباق ثاني');again.onclick=()=>{tap();closeModal();startRace();};c.appendChild(again);
  const gar=el('button','btn soft wide','🚗 الكراج');gar.onclick=()=>{tap();closeModal();toGarage();};c.appendChild(gar);}

/* ================= confetti ================= */
function confetti(){if(reduced)return;const c=$('#confetti');const g=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=['#FF6B57','#FFD23F','#5CE1E6','#2BB673','#FF9EC7','#8A1538'];const P=[];
  for(let i=0;i<120;i++)P.push({x:Math.random()*c.width,y:-20-Math.random()*c.height*0.5,r:6+Math.random()*7,c:rnd(cols),vx:(Math.random()-.5)*2,vy:2.5+Math.random()*3.5});
  const t0=performance.now();(function f(now){g.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;g.fillStyle=p.c;g.fillRect(p.x,p.y,p.r,p.r);});if(now-t0<2400)requestAnimationFrame(f);else g.clearRect(0,0,c.width,c.height);})(t0);}
